<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="puckBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="70%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00a8ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#080c14"/>

  <!-- Outer Kinetic Rink Lines -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1b2a47" stroke-width="4" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#neonPink)" stroke-width="6" opacity="0.6"/>

  <!-- Main Mallet / Puck Body -->
  <circle cx="256" cy="256" r="140" fill="url(#puckBg)" stroke="url(#neonCyan)" stroke-width="14" filter="url(#glow)"/>

  <!-- Energy Wave Ring -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="#00f0ff" stroke-width="5" opacity="0.85" stroke-dasharray="32 16"/>

  <!-- Glowing Core -->
  <circle cx="256" cy="256" r="60" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)"/>

  <!-- Kinetic Crosshairs -->
  <line x1="256" y1="65" x2="256" y2="105" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="407" x2="256" y2="447" stroke="#ff2a6d" stroke-width="8" stroke-linecap="round"/>
  <line x1="65" y1="256" x2="105" y2="256" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="407" y1="256" x2="447" y2="256" stroke="#ff2a6d" stroke-width="8" stroke-linecap="round"/>
</svg>

